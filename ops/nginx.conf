# ═══════════════════════════════════════════════════════════
#  وكيل عكسي لـ RVIOS Store
#      /etc/nginx/sites-available/rvios
#
#  شهادة HTTPS:  certbot --nginx -d rviosstore.com -d www.rviosstore.com
# ═══════════════════════════════════════════════════════════

upstream rvios {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── تحويل كل شيء إلى HTTPS ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name rviosstore.com www.rviosstore.com;
    return 301 https://rviosstore.com$request_uri;
}

# ── توحيد النطاق على النسخة بلا www ──────────────────────
# رابط المتجر يُنشر في واتساب مرة واحدة ولا يُصحَّح بعدها،
# فوجود نسختين من كل رابط يشتّت الفهرسة ويربك التاجر.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rviosstore.com;

    ssl_certificate     /etc/letsencrypt/live/rviosstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rviosstore.com/privkey.pem;

    return 301 https://rviosstore.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rviosstore.com;

    ssl_certificate     /etc/letsencrypt/live/rviosstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rviosstore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # صور المنتجات تصل إلى ٢ ميجابايت، والجسم يسمح بـ٦
    client_max_body_size 8m;

    # مهلة قراءة الجسم: الرفع من شبكة يمنية بطيء
    client_body_timeout 120s;

    # التطبيق يضغط بنفسه (brotli/gzip) — لا نضغط مرتين
    gzip off;

    access_log /var/log/nginx/rvios.access.log;
    error_log  /var/log/nginx/rvios.error.log;

    location / {
        proxy_pass http://rvios;
        proxy_http_version 1.1;

        # هذه الثلاث يعتمد عليها render.js لبناء روابط Open Graph
        # المطلقة. بدونها تظهر معاينة واتساب بروابط محلية مكسورة.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # عنوان العميل الحقيقي — حدود المعدل تعتمد عليه (§٢.٢)
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # فحص الحياة لا يُسجَّل — وإلا أغرق السجل بطلب كل ٣٠ ثانية
    location = /health {
        proxy_pass http://rvios;
        proxy_set_header Host $host;
        access_log off;
    }

    # الصور المرفوعة: أسماؤها بصمات محتوى فهي غير قابلة للتغيير
    location /uploads/ {
        proxy_pass http://rvios;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
