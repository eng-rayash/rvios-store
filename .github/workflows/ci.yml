# ═══════════════════════════════════════════════════════════
#  التكامل المستمر
#  اعتمادية واحدة (عميل postgres)، وقاعدة خدمية للاختبارات.
# ═══════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # قاعدة حقيقية لا محاكاة: الاختبارات تلمس المعاملات
    # وقفل الصفوف، وهذان لا يُحاكيان.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rvios
          POSTGRES_PASSWORD: rvios
          POSTGRES_DB: rvios_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rvios -d rvios_test"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      # أسرار وهمية: الاختبارات تحتاج قيماً موجودة لا صحيحة.
      # المفاتيح الحقيقية لا تدخل CI أبداً.
      NODE_ENV: development
      DATABASE_URL: postgresql://rvios:rvios@localhost:5432/rvios_test?sslmode=disable
      OTP_PROVIDER: console
      OTP_PEPPER: ci-pepper-not-a-real-secret
      VISIT_SALT: ci-salt-not-a-real-secret
      META_APP_SECRET: ci000000000000000000000000000000
      WA_VERIFY_TOKEN: ci_verify_token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: تثبيت الاعتماديات
        run: npm ci --no-audit --no-fund

      - name: شجرة الاعتماديات تبقى ضحلة
        run: |
          npm ls --all
          # حزمة واحدة بلا متعدّيات — أي نموّ هنا قرار لا مفاجأة
          test "$(npm ls --all --parseable | wc -l)" -le 2

      - name: تطبيق المخطّط
        run: npm run migrate

      - name: التحقق من العزل بين المتاجر
        run: node --no-warnings -e "import('./src/tenancy.js').then(m => m.verifyIsolation()).then(() => import('./src/pg.js')).then(m => m.db.close())"

      - name: تدقيق الجاهزية
        run: npm run readiness

      - name: فحص التخزين
        run: npm run check:storage

      - name: تجهيز قاعدة بيانات نظيفة
        run: npm run reset

      - name: تشغيل الخادم
        run: |
          node --no-warnings src/server.js &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done

      - name: الاختبارات
        run: |
          node --no-warnings test/smoke.mjs
          node --no-warnings test/images.mjs
          node --no-warnings test/gallery.mjs
          node --no-warnings test/billing.mjs
          node --no-warnings test/stores.mjs
          node --no-warnings test/pages.mjs
          node --no-warnings test/webhook.mjs
          node --no-warnings test/infra.mjs
          node --no-warnings test/reminders.mjs
          node --no-warnings test/pwa.mjs
          node --no-warnings test/pagination.mjs

      - name: الإيقاف الرشيد يعمل
        run: |
          kill -TERM "$(cat server.pid)"
          sleep 3
          if kill -0 "$(cat server.pid)" 2>/dev/null; then
            echo "✖ العملية لم تتوقّف خلال المهلة"; exit 1
          fi
          echo "✓ توقّف بسلام"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # حارس أخير: مفتاح واتساب مكشوف يعني استنزاف رصيد
      # الرسائل خلال ساعات. أرخص فحص في المشروع وأعلاه عائداً.
      - name: لا أسرار في المصدر
        run: |
          if grep -rEn 'EAA[A-Za-z0-9]{30}' --include='*.js' --include='*.mjs' --include='*.json' --include='*.md' . ; then
            echo "✖ رمز وصول Meta مكتوب في المستودع"; exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "✖ ملف .env متتبَّع في Git"; exit 1
          fi
          echo "✓ لا أسرار متتبَّعة"

  docker:
    runs-on: ubuntu-latest

    # الصورة تُقلع بـNODE_ENV=production، وهناك يرفض الإعداد
    # القاعدةَ الغائبة والأسرارَ الضعيفة. فلتكن القاعدة حقيقية
    # والأسرار طويلة — وإلا صار هذا الفحص اختبارَ رفضٍ لا إقلاع.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rvios
          POSTGRES_PASSWORD: rvios
          POSTGRES_DB: rvios_img
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rvios -d rvios_img"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - name: بناء الصورة
        run: docker build -t rvios-store:ci .
      - name: الصورة تُقلع وتردّ على فحص الحياة
        run: |
          # ‏--network host: القاعدة خدمة على المُشغّل، و«localhost»
          # داخل حاوية معزولة يعني الحاوية نفسها لا المُشغّل.
          docker run -d --name rv --network host \
            -e DATABASE_URL='postgresql://rvios:rvios@localhost:5432/rvios_img?sslmode=disable' \
            -e RVIOS_ADMIN_PASS=ci-not-the-default-0192 \
            -e OTP_PEPPER=ci-pepper-thirty-two-chars-min-0192 \
            -e VISIT_SALT=ci-salt-sixteen-plus \
            rvios-store:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done
          # المخطّط يُطبَّق عند الإقلاع، فردّ صحّي يعني القاعدة قامت
          curl -sf http://localhost:3000/health | grep -q '"ok":true' || {
            echo "✖ لم تقلع الصورة — السجل:"; docker logs rv; exit 1; }
          docker rm -f rv
