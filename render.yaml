# ═══════════════════════════════════════════════════════════
#  مخطّط نشر Render
#
#  الاستعمال: ادفع المستودع إلى GitHub، ثم في Render:
#      New → Blueprint → اختر المستودع
#  يقرأ هذا الملف فيُنشئ الخدمة وحدها: القاعدة خارجية
#  (Supabase)، ولا قرص — انظر التعليقين أدناه.
#
#  ما لا يفعله: الأسرار. تُملأ يدوياً من لوحة Render
#  (Environment) — sync:false أدناه تعني «اسألني عنها».
# ═══════════════════════════════════════════════════════════

services:
  - type: web
    name: rvios-store
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # فرانكفورت لا أوريغون: القاعدة في eu-central-1 وسلة الصور
    # في WEUR. النشر في أمريكا يعني عبور الأطلسي في كل استعلام.
    region: frankfurt
    # المنفذ الذي تعطيه Render (PORT) يأخذه Next وحده — هو
    # الواجهة. والخادم القديم يعيش خلفه على LEGACY_PORT داخل
    # الحاوية ولا يخرج منها (انظر scripts/start.mjs).
    healthCheckPath: /health      # يمرّ عبر Next إلى الخادم، فيثبت أن الطريق بينهما سالك
    autoDeploy: true

    # ── لا قرص دائم ──────────────────────────────────────
    # الأقراص على الخطط المدفوعة وحدها، وهي تمنع تعدّد النسخ
    # وتُوقف النسخة القائمة قبل رفع الجديدة — أي انقطاع ثوانٍ
    # عند كل نشر. لذلك التطبيق بلا حالة: الصور إلى R2.
    #
    # ما دام STORAGE_DRIVER=local فالصور المرفوعة تُمحى مع كل
    # إعادة نشر. هذا مقبول للتجربة وحدها؛ بدّله إلى r2 قبل أن
    # يرفع تاجر حقيقي صورة واحدة.

    envVars:
      # القاعدة خارجية (Supabase · فرانكفورت). يُلصق رابط
      # **المجمّع** لا الاتصال المباشر: المباشر IPv6 فقط ولا يصله
      # Render. الشكل: aws-0-<إقليم>.pooler.supabase.com:5432
      - key: DATABASE_URL
        sync: false

      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
      - key: LOG_JSON
        value: "1"

      # النسخ الاحتياطي: Render يوفّر استعادة زمنية للقاعدة،
      # ونحن ننسخ الصور. pg_dump متاح في الصورة.
      - key: BACKUP_ENABLED
        value: "1"

      # ── تخزين الصور ──
      # للانتقال إلى Cloudflare R2: اجعل القيمة r2، واملأ
      # المفاتيح الأربعة من لوحة Render، ثم احذف كتلة القرص
      # أعلاه. القيم القديمة في القاعدة (/uploads/…) تبقى
      # صالحة — لا ترحيل إجباري.
      - key: STORAGE_DRIVER
        value: local
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # ── أسرار: تُملأ من لوحة Render، لا من هذا الملف ──
      - key: RVIOS_ADMIN_PASS
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: VISIT_SALT
        sync: false
      - key: PUBLIC_URL
        sync: false

      # ── واتساب (اختيارية حتى تُفعّل الإرسال) ──
      - key: OTP_PROVIDER
        value: console
      - key: META_TOKEN
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
